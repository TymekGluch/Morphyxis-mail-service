<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mail Templates Sandbox</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
      }

      li {
        margin: 10px 0;
      }

      a {
        color: #2563eb;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Mail Templates Sandbox</h1>

    <ul>
      {{ range .Templates }}
      <li>
        <a href="/templates/{{ . }}"> {{ . }} </a>
      </li>
      {{ end }}
    </ul>
  </body>
</html>
